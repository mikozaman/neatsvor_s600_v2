clean_rooms:
  target:
    entity:
      domain: vacuum
      integration: neatsvor_s600
  fields:
    room_ids:
      required: true
      selector:
        object:
    fan_level:
      required: true
      default: 2
      selector:
        number:
          min: 1
          max: 3
          mode: box
    water_level:
      required: true
      default: 2
      selector:
        number:
          min: 1
          max: 3
          mode: box
    mode:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 5
          mode: box
