# Exemple de carte Lovelace (vue « Sections » ou « Masonry »).
# Les identifiants de pièces sont ceux de VOTRE carte : ils sont listés dans l'attribut
# `rooms` de image.neatsvor_s600_map (et de vacuum.neatsvor_s600). Adaptez 1, 2, 3.
type: vertical-stack
cards:
  - type: picture-entity
    entity: image.neatsvor_s600_map
    show_name: false
    show_state: false
  - type: entities
    entities:
      - entity: vacuum.neatsvor_s600
      - entity: sensor.neatsvor_s600_battery
  - type: horizontal-stack
    cards:
      - type: button
        name: Pièce 1
        icon: mdi:sofa
        tap_action:
          action: perform-action
          perform_action: neatsvor_s600.clean_rooms
          target: { entity_id: vacuum.neatsvor_s600 }
          data: { room_ids: [1] }   # niveaux par défaut = réglages de la carte
      - type: button
        name: Pièce 2
        icon: mdi:stove
        tap_action:
          action: perform-action
          perform_action: neatsvor_s600.clean_rooms
          target: { entity_id: vacuum.neatsvor_s600 }
          data: { room_ids: [2] }
      - type: button
        name: 1 + 2
        icon: mdi:robot-vacuum
        tap_action:
          action: perform-action
          perform_action: neatsvor_s600.clean_rooms
          target: { entity_id: vacuum.neatsvor_s600 }
          data: { room_ids: [1, 2] }
